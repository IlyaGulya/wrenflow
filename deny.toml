[graph]
targets = ["aarch64-apple-darwin"]
all-features = true

[advisories]
ignore = [
    # Unmaintained (not vulnerability) advisories in exact-pinned transitive
    # dependencies. Each is tracked with owner/expiry/release impact in
    # docs/supply-chain.md.
    "RUSTSEC-2024-0436",
    "RUSTSEC-2024-0384",
    "RUSTSEC-2025-0052",
    "RUSTSEC-2025-0134",
    "RUSTSEC-2026-0173",
    "RUSTSEC-2026-0192",
    "RUSTSEC-2026-0206",
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
# Internal path dependencies inherit the workspace version and therefore look
# wildcarded to cargo-deny; all external dependencies are lockfile-pinned.
wildcards = "allow"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
