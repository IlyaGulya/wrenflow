[workspace]
resolver = "3"
members = [
    "core/wrenflow-domain",
    "core/wrenflow-core",
    "core/wrenflow-runtime",
]
exclude = ["native/wrenflow-gpui"]

[workspace.package]
version = "0.4.0" # x-release-please-version
edition = "2021"
license = "MIT"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_imports = "deny"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls", "stream"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
log = "0.4"
sha2 = "=0.10.9"
semver = { version = "1", features = ["serde"] }
parakeet-rs = "=0.3.4"
cpal = "0.15"
dirs = "6"
