[settings]
ruby.compile = false

[tools]
rust = "1.94.1"
resvg = "0.47.0"
jq = "1.8.1"
ripgrep = "14.1.1"
"cargo:cargo-about" = "0.9.1"
"cargo:cargo-cyclonedx" = "0.5.9"
"cargo:cargo-deny" = "0.20.2"

# ── Tasks ──────────────────────────────────────────────────────

[tasks.setup]
description = "Install Rust tooling and fetch both locked Cargo workspaces"
run = """
mise install
mise run setup-rust-components
cargo fetch --locked
CARGO_HOME="$PWD/build/gpui-production-cargo-home" cargo fetch \
  --manifest-path native/wrenflow-gpui/Cargo.toml \
  --locked \
  --config 'source.crates-io.registry="sparse+https://index.crates.io/"'
"""

[tasks.setup-rust-components]
description = "Install the exact Rust lint/format components required by CI and release gates"
run = """
: "${RUSTUP_TOOLCHAIN:?mise must select the pinned Rust toolchain}"
if [ "$RUSTUP_TOOLCHAIN" != "1.94.1" ]; then
  echo "Expected pinned Rust 1.94.1; got $RUSTUP_TOOLCHAIN" >&2
  exit 1
fi
rustup component add --toolchain "$RUSTUP_TOOLCHAIN" clippy rustfmt
cargo clippy --version
cargo fmt --version
rg --version
"""

[tasks.download-ort]
description = "Download ONNX Runtime dylib if missing"
run = "scripts/download-ort.sh"

[tasks.icons]
description = "Regenerate the production macOS app icon"
run = "scripts/generate-app-icon.sh"

[tasks.build]
description = "Build and sign the production GPUI macOS app bundle"
depends = ["download-ort", "supply-chain-metadata", "verify-macos-support"]
run = "CARGO_HOME=\"$PWD/build/gpui-production-cargo-home\" CARGO_TARGET_DIR=\"$PWD/build/gpui-production-target\" native/wrenflow-gpui/scripts/build-app.sh"

[tasks.verify-macos-support]
description = "Reject drift in the production macOS, architecture and toolchain contract"
run = "scripts/verify-macos-support.sh source"

[tasks.test-macos-support]
description = "Exercise arm64/minimum-version support acceptance and rejection paths"
run = "scripts/test-macos-support.sh"

[tasks.release]
description = "Build the signed, hardened production app bundle"
depends = ["build"]
run = "codesign --verify --deep --strict build/gpui/Wrenflow.app"

[tasks.release-install]
description = "Build release app, replace installed app, and relaunch it"
depends = ["release"]
run = "native/wrenflow-gpui/scripts/install-app.sh"

[tasks.release-uninstall]
description = "Unregister the login item and move the installed GPUI app to Trash"
run = "native/wrenflow-gpui/scripts/uninstall-app.sh"

[tasks.reset-app-data]
description = "Reset an explicit GPUI current-data or legacy-data scope"
run = "native/wrenflow-gpui/scripts/reset-app-data.sh"

[tasks.test-lifecycle-contract]
description = "Validate lifecycle scripts, safe paths, and clean-break declarations"
run = """
native/wrenflow-gpui/scripts/lifecycle-contract-test.sh
native/wrenflow-gpui/scripts/accessibility-harness-test.sh
"""

[tasks.endurance-preflight]
description = "Run deterministic disposable-root GPUI M13-M16/M21-M22 preflight only"
run = "scripts/gpui-endurance-preflight.sh automated"

[tasks.test-endurance-preflight]
description = "Test fail-closed GPUI endurance and candidate-evidence harness behavior"
run = "scripts/gpui-endurance-preflight-test.sh"

[tasks.performance-preflight]
description = "Capture sanitized macOS, hardware, power, xctrace and signed-candidate inventory"
run = "mise exec -- python3 scripts/perf/gpui-performance.py preflight"

[tasks.performance-sample]
description = "Sample one exact LaunchServices GPUI candidate performance phase"
run = "mise exec -- python3 scripts/perf/gpui-performance.py sample"

[tasks.performance-self-test]
description = "Run the two-gate signed GPUI fixture workload through LaunchServices"
run = "mise exec -- python3 scripts/perf/gpui-performance.py self-test"

[tasks.performance-leaks]
description = "Attach macOS leaks to the exact running signed GPUI candidate"
run = "mise exec -- python3 scripts/perf/gpui-performance.py leaks"

[tasks.performance-merge-cold]
description = "Merge five sealed fresh-runner cold-launch evidence shards"
run = "mise exec -- python3 scripts/perf/gpui-performance.py merge-cold"

[tasks.performance-verify]
description = "Verify GPUI candidate evidence against versioned numeric budgets"
run = "mise exec -- python3 scripts/perf/gpui-performance.py verify --budgets support/performance/budgets-v1.json"

[tasks.performance-trace]
description = "Attach an approved Instruments template to one exact signed GPUI candidate"
run = "scripts/perf/capture-instruments.sh"

[tasks.test-performance-harness]
description = "Test fail-closed GPUI performance inventory, observers and budget verification"
run = "scripts/test-gpui-performance.sh"

[tasks.visual-parity-verify]
description = "Verify persisted sanitized Flutter/GPUI captures against the v1 numeric parity contract"
run = "swift native/wrenflow-gpui/scripts/verify-visual-parity.swift support/visual-parity/thresholds-v1.json build/visual-parity"

[tasks.verify-release-runbook]
description = "Validate the GPUI beta/stable runbook policy and workflow source invariants"
run = "scripts/verify-release-promotion.sh source"

[tasks.test-release-runbook]
description = "Test byte-identical and fully revalidated successor promotion decisions"
run = "scripts/test-production-release-runbook.sh"

[tasks.hardening-bundle]
description = "Verify the signed production app bundle and print its identity"
run = "scripts/macos-hardening-matrix.sh check-bundle"

[tasks.hardening-notarized]
description = "Verify a notarized release DMG and its signed app"
run = "scripts/macos-hardening-matrix.sh check-notarized"

[tasks.hardening-lifecycle]
description = "Exercise single-instance, reopen and quit/relaunch on the exact signed GPUI bundle"
depends = ["build"]
run = "native/wrenflow-gpui/scripts/lifecycle-self-test.sh"

[tasks.hardening-accessibility]
description = "Run the signed app and verify the real AppKit accessibility tree bridge"
run = "native/wrenflow-gpui/scripts/accessibility-self-test.sh"

[tasks.hardening-tcc-status]
description = "Read current-user Wrenflow TCC rows without changing consent"
run = "scripts/macos-hardening-matrix.sh tcc-status"

[tasks.hardening-reset-tcc]
description = "Reset Wrenflow TCC consent on an explicitly confirmed disposable account"
run = "scripts/macos-hardening-matrix.sh reset-tcc"

[tasks.run]
description = "Build and launch the signed app through LaunchServices for TCC"
depends = ["build"]
run = "native/wrenflow-gpui/scripts/run-app.sh"

[tasks.logs]
description = "Stream logs emitted by the production app process"
run = "/usr/bin/log stream --style compact --predicate 'process == \"wrenflow\"'"

[tasks.lint]
description = "Run Rust and workflow linters"
depends = ["lint-rust", "lint-app", "lint-workflows"]
run = "true"

[tasks.lint-rust]
description = "Run clippy for all production Rust libraries"
depends = ["setup-rust-components"]
run = "cargo clippy --workspace --lib -- -D warnings"

[tasks.lint-app]
description = "Run clippy for the isolated production app"
depends = ["setup-rust-components"]
run = "CARGO_HOME=\"$PWD/build/gpui-production-cargo-home\" CARGO_TARGET_DIR=\"$PWD/build/gpui-production-target\" cargo clippy --manifest-path native/wrenflow-gpui/Cargo.toml --locked --all-targets --config 'source.crates-io.registry=\"sparse+https://index.crates.io/\"' -- -D warnings"

[tasks.lint-workflows]
description = "Lint GitHub Actions workflows"
tools = { actionlint = "1.7.12", ghalint = "1.5.5" }
run = """
actionlint .github/workflows/*.yml
ghalint run
scripts/test-release-workflow.sh
"""

[tasks.test]
description = "Run core/runtime and production app tests"
depends = ["test-rust", "test-app", "test-lifecycle-contract", "test-macos-support", "test-supply-chain", "test-endurance-preflight", "test-release-runbook", "test-performance-harness"]
run = "true"

[tasks.test-rust]
description = "Run domain, core and runtime tests"
depends = ["download-ort"]
run = """
ORT_DYLIB_PATH="$PWD/vendor/onnxruntime/lib/libonnxruntime.dylib" \
  cargo test -p wrenflow-domain -p wrenflow-core --lib -- --test-threads=1
cargo test -p wrenflow-runtime --all-targets -- --test-threads=1
"""

[tasks.test-app]
description = "Run all isolated production app tests"
run = "CARGO_HOME=\"$PWD/build/gpui-production-cargo-home\" CARGO_TARGET_DIR=\"$PWD/build/gpui-production-target\" cargo test --manifest-path native/wrenflow-gpui/Cargo.toml --locked --all-targets --config 'source.crates-io.registry=\"sparse+https://index.crates.io/\"'"

[tasks.test-recordings]
description = "Run transcription regression against an explicit immutable app-support fixture"
depends = ["download-ort"]
run = """
: "${WRENFLOW_RECORDINGS_FIXTURE_DIR:?set WRENFLOW_RECORDINGS_FIXTURE_DIR to an immutable Wrenflow app-support fixture}"
ORT_DYLIB_PATH="$PWD/vendor/onnxruntime/lib/libonnxruntime.dylib" \
  cargo test -p wrenflow-core --test saved_recordings_regression \
  transcribes_saved_parakeet_recordings_from_fixture -- \
  --ignored --exact --nocapture --test-threads=1
"""

[tasks.export-whisper-onnx]
description = "Export vanilla Whisper Turbo to ONNX via Optimum (spike utility)"
run = "scripts/export-whisper-onnx.sh"

[tasks.quantize-whisper-onnx]
description = "Quantize an exported Whisper ONNX bundle to dynamic INT8 (spike utility)"
run = "scripts/quantize-whisper-onnx.sh"

[tasks.static-quantize-whisper-encoder]
description = "Static-quantize the Whisper encoder using local recordings for calibration"
run = "scripts/static-quantize-whisper-encoder.sh"

[tasks.bucketize-whisper-onnx]
description = "Rewrite the installed Whisper ONNX bundle to a smaller fixed encoder frame bucket"
run = "python3 scripts/bucketize-whisper-onnx.py"

[tasks.benchmark-whisper-onnx]
description = "Benchmark Whisper ONNX variants on a saved recording (spike utility)"
run = "scripts/benchmark-whisper-onnx.sh"

[tasks.summarize-whisper-ort-profile]
description = "Summarize ORT operator profiling JSON for Whisper spike work"
run = "scripts/summarize-whisper-ort-profile.py"

[tasks.summarize-whisper-history]
description = "Summarize recent Whisper runs from local Wrenflow history"
run = "python3 scripts/summarize-whisper-history.py"

[tasks.cleanup-whisper-spike]
description = "Clean up old Whisper ONNX spike artifacts from /tmp"
run = "bash scripts/cleanup-whisper-spike.sh"

[tasks.install-whisper-onnx-export]
description = "Install a custom quantized Whisper ONNX export into local Wrenflow models (spike utility)"
run = "scripts/install-whisper-onnx-export.sh"

[tasks.check]
description = "Check the core workspace and production app"
depends = ["check-rust", "check-app"]
run = "true"

[tasks.check-rust]
description = "Check all core/runtime Rust targets"
run = "cargo check --workspace --all-targets"

[tasks.check-app]
description = "Check the isolated production app"
run = "CARGO_HOME=\"$PWD/build/gpui-production-cargo-home\" CARGO_TARGET_DIR=\"$PWD/build/gpui-production-target\" cargo check --manifest-path native/wrenflow-gpui/Cargo.toml --locked --all-targets --config 'source.crates-io.registry=\"sparse+https://index.crates.io/\"'"

[tasks.gpui-spike-check]
description = "Compile the isolated GPUI macOS shell spike"
run = "CARGO_HOME=\"$PWD/build/gpui-spike-cargo-home\" cargo check --manifest-path spikes/gpui-macos/Cargo.toml --locked --config 'source.crates-io.registry=\"sparse+https://index.crates.io/\"'"

[tasks.gpui-spike-build]
description = "Build and sign the isolated GPUI macOS app bundle"
run = "spikes/gpui-macos/scripts/build-app.sh"

[tasks.gpui-spike-run]
description = "Launch the signed GPUI spike through LaunchServices"
depends = ["gpui-spike-build"]
run = "spikes/gpui-macos/scripts/run-app.sh"

[tasks.pin-actions]
description = "Pin GitHub Actions to full-length commit SHAs"
depends = ["lint-workflows"]
tools = { pinact = "3.9.0" }
run = "pinact run"

[tasks.supply-chain-audit]
description = "Reject vulnerable, unapproved-license, wildcard-source and unlocked Rust dependencies"
run = """
cargo deny --locked check advisories licenses bans sources
cargo deny --manifest-path native/wrenflow-gpui/Cargo.toml --locked check advisories licenses bans sources
"""

[tasks.supply-chain-fetch]
description = "Fetch the complete locked production graph for offline license harvesting"
run = "cargo fetch --manifest-path native/wrenflow-gpui/Cargo.toml --locked"

[tasks.supply-chain-metadata]
description = "Generate deterministic CycloneDX, license inventory, checksums and provenance inputs"
depends = ["supply-chain-audit", "supply-chain-fetch"]
run = "scripts/generate-supply-chain.sh"

[tasks.setup-release-tools]
description = "Install checksum-pinned create-dmg 1.3.0"
run = "scripts/install-release-tools.sh"

[tasks.test-supply-chain]
description = "Exercise fail-closed download, metadata, notice and workflow invariants"
depends = ["supply-chain-metadata"]
run = "scripts/test-supply-chain.sh"

[tasks.clean]
description = "Clean all build artifacts"
run = """
cargo clean
CARGO_HOME="$PWD/build/gpui-production-cargo-home" CARGO_TARGET_DIR="$PWD/build/gpui-production-target" \
  cargo clean --manifest-path native/wrenflow-gpui/Cargo.toml
[ ! -d "$PWD/build/gpui" ] || trash "$PWD/build/gpui"
"""
