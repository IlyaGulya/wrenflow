name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      release_tag:
        description: Stable release tag created by release-please
        required: true
        type: string
    secrets:
      DEVELOPER_ID_CERTIFICATE_BASE64:
        required: false
      DEVELOPER_ID_CERTIFICATE_PASSWORD:
        required: false
      KEYCHAIN_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_APP_PASSWORD:
        required: false

concurrency:
  group: build-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      HAS_SIGNING_CERT: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 != '' && secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD != '' && secrets.KEYCHAIN_PASSWORD != '' }}
      HAS_NOTARIZE: ${{ secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      IS_RELEASE: ${{ inputs.release_tag != '' }}
      IS_BETA: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.release_tag == '' }}
      IS_PR: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check if release-please commit
        id: skip
        run: |
          MSG=$(git log -1 --pretty=%s)
          if [ "${{ env.IS_BETA }}" = "true" ] && echo "$MSG" | grep -qE '^chore\(main\): release'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Select Xcode 26.3
        if: steps.skip.outputs.skip != 'true'
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Install mise
        if: steps.skip.outputs.skip != 'true'
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Install build tools
        if: steps.skip.outputs.skip != 'true'
        run: brew install create-dmg

      - name: Cache Rust
        if: steps.skip.outputs.skip != 'true'
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: |
            . -> target
            native/wrenflow-gpui -> target
          cache-on-failure: "true"
          prefix-key: "v3-rust"

      - name: sccache
        if: steps.skip.outputs.skip != 'true'
        uses: Mozilla-Actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a # v0.0.9
        with:
          version: "v0.14.0"

      - name: Configure sccache for Rust
        if: steps.skip.outputs.skip != 'true'
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

      - name: Compute version info
        if: steps.skip.outputs.skip != 'true'
        id: version
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

          if [ "${{ env.IS_RELEASE }}" = "true" ]; then
            TAG="$RELEASE_TAG"
          else
            LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            LATEST_TAG="${LATEST_TAG:-v0.0.0}"
            COMMITS_SINCE=$(git rev-list "${LATEST_TAG}..HEAD" --count)
            VERSION="${LATEST_TAG#v}"
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            NEXT_MINOR=$((MINOR + 1))
            TAG="v${MAJOR}.${NEXT_MINOR}.0-beta.${COMMITS_SINCE}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Require release signing and notarization credentials
        if: steps.skip.outputs.skip != 'true' && env.IS_PR != 'true'
        run: |
          if [ "$HAS_SIGNING_CERT" != "true" ]; then
            echo "Published artifacts require the Developer ID certificate, certificate password, and keychain password" >&2
            exit 1
          fi
          if [ "$HAS_NOTARIZE" != "true" ]; then
            echo "Published artifacts require APPLE_ID, APPLE_TEAM_ID, and APPLE_APP_PASSWORD" >&2
            exit 1
          fi

      - name: Import signing certificate
        if: steps.skip.outputs.skip != 'true' && env.IS_PR != 'true'
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain >/dev/null 2>&1
          security list-keychains -d user -s build.keychain login.keychain
          rm certificate.p12
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$IDENTITY" != "Developer ID Application: Ilya Gulya (T4LV8K9BGV)" ]; then
            echo "Expected Wrenflow Developer ID identity was not imported; got: ${IDENTITY:-none}" >&2
            exit 1
          fi
          echo "WRENFLOW_GPUI_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Configure ad-hoc signing
        if: steps.skip.outputs.skip != 'true' && env.IS_PR == 'true'
        run: echo "WRENFLOW_GPUI_SIGN_IDENTITY=-" >> "$GITHUB_ENV"

      - name: Check and build pull request
        if: steps.skip.outputs.skip != 'true' && env.IS_PR == 'true'
        run: |
          mise run check
          mise run build

      - name: Test and lint publishable build
        if: steps.skip.outputs.skip != 'true' && env.IS_PR != 'true'
        run: |
          mise run test
          mise run lint

      - name: Build release
        if: steps.skip.outputs.skip != 'true' && env.IS_PR != 'true'
        env:
          WRENFLOW_VERSION: ${{ steps.version.outputs.version }}
          WRENFLOW_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: mise run release

      - name: Create DMG
        if: steps.skip.outputs.skip != 'true' && env.IS_PR != 'true'
        run: |
          APP="build/gpui/Wrenflow.app"
          DMG="build/Wrenflow.dmg"
          mkdir -p build
          rm -f "$DMG"
          create-dmg \
            --volname "Wrenflow" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 128 \
            --icon "Wrenflow.app" 180 170 \
            --hide-extension "Wrenflow.app" \
            --app-drop-link 480 170 \
            --no-internet-enable \
            "$DMG" "$APP"

          if [ -n "$WRENFLOW_GPUI_SIGN_IDENTITY" ] && [ "$WRENFLOW_GPUI_SIGN_IDENTITY" != "-" ]; then
            codesign --force --sign "$WRENFLOW_GPUI_SIGN_IDENTITY" --timestamp "$DMG"
          fi

      - name: Notarize DMG
        if: steps.skip.outputs.skip != 'true' && env.IS_PR != 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/notarize-release.sh build/Wrenflow.dmg

      - name: Verify signed and notarized artifact
        if: steps.skip.outputs.skip != 'true' && env.IS_PR != 'true'
        run: scripts/verify-release-artifact.sh build/gpui/Wrenflow.app build/Wrenflow.dmg --require-notarized

      - name: Clean up keychain
        if: always()
        run: security delete-keychain build.keychain 2>/dev/null || true

      # Release: upload DMG to existing GitHub Release
      - name: Upload DMG to release
        if: env.IS_RELEASE == 'true'
        run: mv build/Wrenflow.dmg Wrenflow.dmg
      - uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        if: env.IS_RELEASE == 'true'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: Wrenflow.dmg

      # Beta: create pre-release with DMG
      - name: Create beta pre-release
        if: steps.skip.outputs.skip != 'true' && env.IS_BETA == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          mv build/Wrenflow.dmg Wrenflow.dmg
          gh release create "$TAG" Wrenflow.dmg \
            --title "Wrenflow $TAG" \
            --prerelease \
            --notes "Beta build from \`main\`. [Latest stable release](https://github.com/${{ github.repository }}/releases/latest)."
