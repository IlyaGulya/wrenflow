name: Promote Verified Stable Draft

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact release-please stable tag, for example v0.4.0
        required: true
        type: string
      release_id:
        description: Exact positive numeric GitHub Release ID of the private draft
        required: true
        type: string
      release_tool_source_commit:
        description: Exact reviewed commit containing private draft API tooling
        required: true
        type: string
      expected_dmg_sha256:
        description: Approved lowercase SHA-256 of the staged Wrenflow.dmg
        required: true
        type: string
      confirmation:
        description: Type PROMOTE_VERIFIED_STABLE after the recorded go/no-go
        required: true
        type: string

concurrency:
  group: promote-stable-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    name: Verify exact draft bytes and publish without rebuilding
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_ID: ${{ inputs.release_id }}
      RELEASE_TOOL_SOURCE_COMMIT: ${{ inputs.release_tool_source_commit }}
      EXPECTED_DMG_SHA256: ${{ inputs.expected_dmg_sha256 }}
      PROMOTION_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.release_tool_source_commit }}
          path: .release-workflow
          sparse-checkout: |
            scripts/private-release-api.py
            scripts/verify-release-promotion.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Require reviewed private draft tooling source
        run: |
          if [ "$RELEASE_TOOL_SOURCE_COMMIT" != "aa025228f4f8d12e29c866b6be43eb2c0bf0834c" ] || \
             [ "$(git -C .release-workflow rev-parse HEAD)" != "$RELEASE_TOOL_SOURCE_COMMIT" ]; then
            echo "Private draft tooling does not match the reviewed immutable source" >&2
            exit 1
          fi

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Validate manual promotion inputs and derive private draft source
        id: inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_tag must be a canonical stable SemVer tag" >&2
            exit 1
          fi
          if ! [[ "$EXPECTED_DMG_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "expected_dmg_sha256 must be a lowercase SHA-256" >&2
            exit 1
          fi
          if [ "$PROMOTION_CONFIRMATION" != "PROMOTE_VERIFIED_STABLE" ]; then
            echo "Explicit stable promotion confirmation is missing" >&2
            exit 1
          fi
          SOURCE_COMMIT=$(mise exec -- python3 .release-workflow/scripts/private-release-api.py derive-source \
            --repo "$GITHUB_REPOSITORY" \
            --release-id "$RELEASE_ID" \
            --tag "$RELEASE_TAG")
          mise exec -- python3 .release-workflow/scripts/private-release-api.py inspect \
            --repo "$GITHUB_REPOSITORY" \
            --release-id "$RELEASE_ID" \
            --tag "$RELEASE_TAG" \
            --source "$SOURCE_COMMIT" \
            --state staged \
            --output release-source.json
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" \
            > release-tag-refs.json
          if ! [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Private stable draft did not record one exact source commit" >&2
            exit 1
          fi
          jq -e --argjson id "$RELEASE_ID" --arg tag "$RELEASE_TAG" --arg source "$SOURCE_COMMIT" '
            .id == $id and .tagName == $tag and .targetCommitish == $source and
            .isDraft == true and .isPrerelease == false and
            ([.assets[].name] | sort) == ([
              "RustThirdPartyLicenses.txt",
              "SHA256SUMS",
              "Wrenflow.cdx.json",
              "Wrenflow.dmg",
              "artifact-provenance.json",
              "exceptions.json",
              "pins.json",
              "provenance.json",
              "release-evidence.json"
            ] | sort)
          ' release-source.json >/dev/null
          jq -e --arg ref "refs/tags/$RELEASE_TAG" '
            type == "array" and ([.[] | select(.ref == $ref)] | length) == 0
          ' release-tag-refs.json >/dev/null
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.inputs.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.release_tool_source_commit }}
          path: .release-workflow
          sparse-checkout: |
            scripts/private-release-api.py
            scripts/verify-release-promotion.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Reconfirm reviewed private draft tooling source
        run: |
          if [ "$(git -C .release-workflow rev-parse HEAD)" != \
               "aa025228f4f8d12e29c866b6be43eb2c0bf0834c" ]; then
            echo "Private draft tooling checkout drifted after release-source checkout" >&2
            exit 1
          fi

      - name: Require the exact untouched release-please draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ steps.inputs.outputs.source_commit }}
        run: |
          mise exec -- python3 .release-workflow/scripts/private-release-api.py inspect \
            --repo "$GITHUB_REPOSITORY" \
            --release-id "$RELEASE_ID" \
            --tag "$RELEASE_TAG" \
            --source "$SOURCE_COMMIT" \
            --state staged \
            --output release-before.json
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" \
            > release-tag-refs-before.json
          jq -e --argjson id "$RELEASE_ID" --arg tag "$RELEASE_TAG" --arg source "$SOURCE_COMMIT" '
            .id == $id and .tagName == $tag and .targetCommitish == $source and
            .isDraft == true and .isPrerelease == false and
            ([.assets[].name] | sort) == ([
              "RustThirdPartyLicenses.txt",
              "SHA256SUMS",
              "Wrenflow.cdx.json",
              "Wrenflow.dmg",
              "artifact-provenance.json",
              "exceptions.json",
              "pins.json",
              "provenance.json",
              "release-evidence.json"
            ] | sort)
          ' release-before.json >/dev/null
          jq -e --arg ref "refs/tags/$RELEASE_TAG" '
            type == "array" and ([.[] | select(.ref == $ref)] | length) == 0
          ' \
            release-tag-refs-before.json >/dev/null
          jq -S . release-before.json > release-fingerprint-before.json

      - name: Download and authenticate every staged byte
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ steps.inputs.outputs.source_commit }}
        run: |
          mkdir staged
          mise exec -- python3 .release-workflow/scripts/private-release-api.py download \
            --repo "$GITHUB_REPOSITORY" \
            --release-id "$RELEASE_ID" \
            --tag "$RELEASE_TAG" \
            --source "$SOURCE_COMMIT" \
            --state staged \
            --directory "$PWD/staged"
          (cd staged && shasum -a 256 -c SHA256SUMS)
          ACTUAL_DMG_SHA256=$(shasum -a 256 staged/Wrenflow.dmg | awk '{print $1}')
          if [ "$ACTUAL_DMG_SHA256" != "$EXPECTED_DMG_SHA256" ]; then
            echo "Staged DMG does not match the manually approved SHA-256" >&2
            exit 1
          fi
          mise exec -- .release-workflow/scripts/verify-release-promotion.sh staged \
            release-before.json "$PWD/staged" "$RELEASE_TAG" \
            "$EXPECTED_DMG_SHA256" "$SOURCE_COMMIT" "$RELEASE_ID"

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Mount and verify the exact staged app
        run: |
          VERIFY_ROOT=$(mktemp -d /tmp/wrenflow-stable-promotion.XXXXXX)
          MOUNT="$VERIFY_ROOT/mount"
          mkdir "$MOUNT"
          trap 'hdiutil detach "$MOUNT" >/dev/null 2>&1 || true; rm -rf "$VERIFY_ROOT"' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" staged/Wrenflow.dmg
          ditto "$MOUNT/Wrenflow.app" "$VERIFY_ROOT/Wrenflow.app"
          hdiutil detach "$MOUNT"
          mise exec -- scripts/verify-release-artifact.sh \
            "$VERIFY_ROOT/Wrenflow.app" staged/Wrenflow.dmg --require-notarized

      - name: Close the draft-to-public time-of-check gap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ steps.inputs.outputs.source_commit }}
        run: |
          mise exec -- python3 .release-workflow/scripts/private-release-api.py inspect \
            --repo "$GITHUB_REPOSITORY" \
            --release-id "$RELEASE_ID" \
            --tag "$RELEASE_TAG" \
            --source "$SOURCE_COMMIT" \
            --state staged \
            --output release-second-check.json
          jq -S . release-second-check.json > release-fingerprint-second.json
          cmp release-fingerprint-before.json release-fingerprint-second.json
          mkdir staged-second-download
          mise exec -- python3 .release-workflow/scripts/private-release-api.py download \
            --repo "$GITHUB_REPOSITORY" \
            --release-id "$RELEASE_ID" \
            --tag "$RELEASE_TAG" \
            --source "$SOURCE_COMMIT" \
            --state staged \
            --directory "$PWD/staged-second-download"
          (cd staged-second-download && shasum -a 256 -c SHA256SUMS)
          for asset in staged/*; do
            name=$(basename "$asset")
            cmp "$asset" "staged-second-download/$name"
          done
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" \
            > release-tag-refs-second.json
          jq -e --arg ref "refs/tags/$RELEASE_TAG" '
            type == "array" and ([.[] | select(.ref == $ref)] | length) == 0
          ' \
            release-tag-refs-second.json >/dev/null

      - name: Publish the verified draft without touching assets
        id: promote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ steps.inputs.outputs.source_commit }}
        run: |
          mise exec -- python3 .release-workflow/scripts/private-release-api.py publish \
            --repo "$GITHUB_REPOSITORY" \
            --release-id "$RELEASE_ID" \
            --tag "$RELEASE_TAG" \
            --source "$SOURCE_COMMIT" \
            --approved-fingerprint release-fingerprint-second.json \
            --output release-public.json
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          if [ "$(git rev-list -n 1 "$RELEASE_TAG")" != "$SOURCE_COMMIT" ]; then
            echo "Published stable tag does not resolve to the approved source commit" >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" \
            > release-tag-refs-public.json
          jq -e --arg tag "refs/tags/$RELEASE_TAG" --arg source "$SOURCE_COMMIT" '
            type == "array" and
            ([.[] | select(.ref == $tag)] |
              length == 1 and .[0].object.type == "commit" and
              .[0].object.sha == $source)
          ' release-tag-refs-public.json >/dev/null
          jq -e --argjson id "$RELEASE_ID" --arg tag "$RELEASE_TAG" --arg source "$SOURCE_COMMIT" '
            .id == $id and .tagName == $tag and .targetCommitish == $source and
            .isDraft == false and .isPrerelease == false and
            ([.assets[].name] | sort) == ([
              "RustThirdPartyLicenses.txt",
              "SHA256SUMS",
              "Wrenflow.cdx.json",
              "Wrenflow.dmg",
              "artifact-provenance.json",
              "exceptions.json",
              "pins.json",
              "provenance.json",
              "release-evidence.json"
            ] | sort)
          ' release-public.json >/dev/null
          LATEST_TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [ "$LATEST_TAG" != "$RELEASE_TAG" ]; then
            echo "Published stable release did not become latest" >&2
            exit 1
          fi
          RELEASE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          jq -S -n \
            --arg tag "$RELEASE_TAG" \
            --arg sha "$EXPECTED_DMG_SHA256" \
            --arg source "$SOURCE_COMMIT" \
            --argjson release_id "$RELEASE_ID" \
            --arg workflow "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{
              schema_version: 1,
              decision: "published_exact_staged_bytes",
              release_tag: $tag,
              release_id: $release_id,
              dmg_sha256: $sha,
              source_commit: $source,
              promotion_workflow: $workflow
            }
          ' > promotion-evidence.json

      - name: Re-download the public release and prove byte identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir public-download
          mise exec -- python3 .release-workflow/scripts/private-release-api.py download \
            --repo "$GITHUB_REPOSITORY" \
            --release-id "$RELEASE_ID" \
            --tag "$RELEASE_TAG" \
            --source "${{ steps.inputs.outputs.source_commit }}" \
            --state public \
            --directory "$PWD/public-download"
          mise exec -- .release-workflow/scripts/verify-release-promotion.sh published \
            release-public.json "$PWD/public-download" "$RELEASE_TAG" \
            "$EXPECTED_DMG_SHA256" "${{ steps.inputs.outputs.source_commit }}" \
            "$RELEASE_ID"
          mise exec -- .release-workflow/scripts/verify-release-promotion.sh promotion \
            "$PWD/staged" "$PWD/public-download"
          ACTUAL_DMG_SHA256=$(shasum -a 256 public-download/Wrenflow.dmg | awk '{print $1}')
          if [ "$ACTUAL_DMG_SHA256" != "$EXPECTED_DMG_SHA256" ]; then
            echo "Public stable DMG differs from the approved staged bytes" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-promotion-evidence-${{ inputs.release_tag }}
          path: promotion-evidence.json
          if-no-files-found: error
          retention-days: 30
